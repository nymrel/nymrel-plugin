[project]
name = "nymrel-hosted-mcp"
version = "1.2.0"
description = "Nymrel's public MCP service and activation-held private handoff adapter."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastmcp==4.1.6",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "mcp==2.3.0",
  "pydantic==2.14.3",
  "requests==2.34.2",
  "starlette==1.10.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
