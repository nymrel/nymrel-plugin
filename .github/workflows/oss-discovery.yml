name: OSS diagnostic experiment

on:
  pull_request:
    branches: [main]
    paths: ["resources/oss-discovery/**", ".github/workflows/oss-discovery.yml"]
  push:
    branches: [main]
    paths: ["resources/oss-discovery/**", ".github/workflows/oss-discovery.yml"]

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify offline core and pilot contracts
        working-directory: resources/oss-discovery/mcp-preflight
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Execute five synthetic scenarios
        working-directory: resources/oss-discovery/mcp-preflight
        run: python validation/run_scenarios.py --output scenario-output
