name: Workflow starter kit

on:
  push:
    branches: [main]
    paths: ["resources/workflow-starter-kit/**", ".github/workflows/workflow-starter-kit.yml"]
  pull_request:
    branches: [main]
    paths: ["resources/workflow-starter-kit/**", ".github/workflows/workflow-starter-kit.yml"]

permissions:
  contents: read

jobs:
  offline-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test offline renderer and CLI
        working-directory: resources/workflow-starter-kit/skills/evidence-workspace
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build the public synthetic example
        working-directory: resources/workflow-starter-kit/skills/evidence-workspace
        run: python scripts/evidence_workspace.py build --input references/synthetic-example.json --audience public --output example-output
