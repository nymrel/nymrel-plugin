name: Nymrel plugin contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nymrel-plugin-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-contract:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript harness and local MCP contract
        run: npm run verify

      - name: Verify generated distribution is committed
        run: git diff --exit-code -- dist

  hosted-mcp-contract:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: hosted-mcp/requirements*.txt

      - name: Install pinned runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -r hosted-mcp/requirements-test.txt

      - name: Compile hosted MCP source
        run: python -m compileall -q hosted-mcp/api

      - name: Run hosted MCP contract, packaging, and review-case tests
        run: python -m pytest hosted-mcp/tests -q
